<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Embed | Define Job Parameters</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo"><span>CV</span>Embed</div>
            <div class="steps">
                <div class="step completed">1. Add Resume</div>
                <div class="step active">2. Specify Job</div>
                <div class="step">3. Analyze</div>
            </div>
        </header>

        <main>
            <div class="glass-card">
                <h2>Target Job Specification</h2>
                <p style="color: var(--text-muted); margin-bottom: 30px;">Choose a matching engine and provide the job requirements to calculate your compatibility score.</p>
                
                <form action="/process_jd" method="post" enctype="multipart/form-data">
                    <div style="max-width: 400px; margin: 0 auto 40px;">
                        <label for="model_type" style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 10px; color: var(--primary-light);">Matching Algorithm</label>
                        <select id="model_type" name="model_type">
                            <option value="sbert">SBERT Optimizer (Deep Learning)</option>
                            <option value="glove">GloVe Semantic Vectoring</option>
                            <option value="doc2vec">Doc2Vec Document Embedding</option>
                        </select>
                    </div>

                    <div class="upload-wrapper">
                        <div class="upload-box" onclick="document.getElementById('jd_file').click()">
                            <input type="file" id="jd_file" name="jd_file" accept=".pdf,.docx,.txt" style="display: none;">
                            <span class="upload-icon">📋</span>
                            <p class="upload-title">Import Requirements</p>
                            <p class="upload-subtitle">PDF, DOCX or TXT</p>
                        </div>
                        
                        <div class="or-divider">OR</div>
                        
                        <div class="text-input-area">
                            <textarea id="jd_text" name="jd_text" placeholder="Paste the job description or specific requirements here..."></textarea>
                        </div>
                    </div>
                    
                    <div style="text-align: center;">
                        <button type="submit" class="btn-primary">
                            Run AI Intelligence Match <span>✨</span>
                        </button>
                    </div>
                </form>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 CVEmbed AI. Precision Resume Matching Engine.</p>
        </footer>
    </div>
</body>
</html>
