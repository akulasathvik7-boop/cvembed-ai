# https://render.com/docs/yaml-spec
# After push: Render creates a Web Service and shows URL like https://cv-embed-xxxx.onrender.com
services:
  - type: web
    name: cv-embed
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "10000"
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URL
        sync: false
